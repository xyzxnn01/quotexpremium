<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Signal Bot — Live Trading Signals</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="logo">📊 Quotex Signal Bot</h1>
                <span class="badge live-badge" id="statusBadge">● CONNECTING</span>
                <span class="mode-badge mode-fallback" id="dataMode">📊 yFinance</span>
            </div>
            <div class="header-right">
                <span class="clock" id="clock"></span>
            </div>
        </header>

        <!-- Quotex Connection Bar -->
        <div class="qx-bar" id="qxBar">
            <div class="qx-bar-left">
                <span class="qx-dot" id="qxDot"></span>
                <span class="qx-status-text" id="qxStatusText">Connect to Quotex for live OTC data</span>
            </div>
            <div class="qx-bar-right">
                <span class="qx-info" id="qxInfo" style="display:none;">
                    <span id="qxTickCount">Ticks: 0</span>
                    <span id="qxCandleCount">Candles: 0</span>
                    <span id="qxLivePrice">Price: —</span>
                </span>
                <button class="btn btn-quotex" id="quotexLoginBtn">🔑 Login to Quotex</button>
                <button class="btn btn-connect" id="quotexConnectBtn" style="display:none;">⚡ Connect Live</button>
                <button class="btn btn-disconnect" id="quotexDisconnectBtn" style="display:none;">✕ Disconnect</button>
            </div>
        </div>

        <!-- Market Type Tabs -->
        <div class="market-tabs">
            <button class="tab-btn active" data-filter="all">All Markets</button>
            <button class="tab-btn" data-filter="regular">Regular</button>
            <button class="tab-btn tab-otc" data-filter="otc">🌙 OTC Markets</button>
            <button class="tab-btn" data-filter="Forex">Forex</button>
            <button class="tab-btn" data-filter="Forex OTC">Forex OTC</button>
            <button class="tab-btn" data-filter="Crypto">Crypto</button>
            <button class="tab-btn" data-filter="Crypto OTC">Crypto OTC</button>
            <button class="tab-btn" data-filter="Commodity">Commodity</button>
            <button class="tab-btn" data-filter="Commodity OTC">Commodity OTC</button>
            <button class="tab-btn" data-filter="Stock">Stock</button>
            <button class="tab-btn" data-filter="Stock OTC">Stock OTC</button>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <label>Asset</label>
                <select id="assetSelect"></select>
            </div>
            <div class="control-group">
                <label>Timeframe</label>
                <select id="timeframeSelect">
                    <option value="1m">1 Minute</option>
                    <option value="5m" selected>5 Minutes</option>
                    <option value="15m">15 Minutes</option>
                    <option value="1h">1 Hour</option>
                </select>
            </div>
            <button class="btn btn-primary" id="analyzeBtn">🔍 Analyze</button>
            <button class="btn btn-secondary" id="scanBtn">📡 Scan All Assets</button>
        </div>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- Chart Panel -->
            <div class="panel chart-panel">
                <div class="panel-header">
                    <h2 id="chartTitle">EUR/USD — 5m</h2>
                    <div class="price-display">
                        <span class="current-price" id="currentPrice">—</span>
                    </div>
                </div>
                <div id="chart" class="chart-container"></div>
            </div>

            <!-- Signal Panel -->
            <div class="panel signal-panel">
                <div class="panel-header">
                    <h2>🎯 Signal Analysis</h2>
                </div>
                <div id="signalContent" class="signal-content">
                    <div class="placeholder">Select an asset and click <strong>Analyze</strong> to get signals</div>
                </div>
            </div>
        </div>

        <!-- Signal History / Scanner -->
        <div class="bottom-section">
            <div class="panel">
                <div class="panel-header">
                    <h2>📡 Signal Scanner</h2>
                    <span class="subtitle" id="scanTime">Click "Scan All Assets" to start</span>
                </div>
                <div id="scannerContent" class="scanner-grid">
                    <div class="placeholder">No scan data yet</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/quotex-bridge.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
