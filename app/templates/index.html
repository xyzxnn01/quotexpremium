<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Signal Bot — Live Trading Signals</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="logo">📊 Quotex Signal Bot</h1>
                <span class="badge live-badge" id="statusBadge">● CONNECTING</span>
            </div>
            <div class="header-right">
                <span class="clock" id="clock"></span>
            </div>
        </header>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <label>Asset</label>
                <select id="assetSelect"></select>
            </div>
            <div class="control-group">
                <label>Timeframe</label>
                <select id="timeframeSelect">
                    <option value="1m">1 Minute</option>
                    <option value="5m" selected>5 Minutes</option>
                    <option value="15m">15 Minutes</option>
                    <option value="1h">1 Hour</option>
                </select>
            </div>
            <button class="btn btn-primary" id="analyzeBtn">🔍 Analyze</button>
            <button class="btn btn-secondary" id="scanBtn">📡 Scan All Assets</button>
        </div>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- Chart Panel -->
            <div class="panel chart-panel">
                <div class="panel-header">
                    <h2 id="chartTitle">EUR/USD — 5m</h2>
                    <div class="price-display">
                        <span class="current-price" id="currentPrice">—</span>
                    </div>
                </div>
                <div id="chart" class="chart-container"></div>
            </div>

            <!-- Signal Panel -->
            <div class="panel signal-panel">
                <div class="panel-header">
                    <h2>🎯 Signal Analysis</h2>
                </div>
                <div id="signalContent" class="signal-content">
                    <div class="placeholder">Select an asset and click <strong>Analyze</strong> to get signals</div>
                </div>
            </div>
        </div>

        <!-- Signal History / Scanner -->
        <div class="bottom-section">
            <div class="panel">
                <div class="panel-header">
                    <h2>📡 Signal Scanner</h2>
                    <span class="subtitle" id="scanTime">Click "Scan All Assets" to start</span>
                </div>
                <div id="scannerContent" class="scanner-grid">
                    <div class="placeholder">No scan data yet</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
